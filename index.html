<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#635bff" />
  <title>Scrap Khata</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="wrap">

  <header class="hero" id="hero">
    <h1 class="title">Scrap Khata</h1>
    <p class="hero-label" id="baakiLabel">Abhi Baaki</p>
    <p class="hero-amount" id="baakiAmount">…</p>
  </header>

  <form id="khataForm" class="card" novalidate>

    <section class="block">
      <h2 class="block-title">Scrap <span class="hint">(agar liya ho)</span></h2>
      <div id="items"></div>
      <button type="button" id="addItemBtn" class="btn-link">+ Aur Scrap</button>
    </section>

    <section class="block fields">
      <div class="field">
        <label for="mila">Paisa Mila</label>
        <input id="mila" type="number" inputmode="decimal" min="0" step="0.01" placeholder="₹ 0" />
      </div>
      <div class="field">
        <label for="kaise">Kaise</label>
        <select id="kaise"></select>
      </div>
      <div class="field">
        <label for="kisne">Kisne</label>
        <input id="kisne" type="text" placeholder="Naam" />
      </div>
      <div class="field">
        <label for="note">Note</label>
        <input id="note" type="text" placeholder="Kuch likhna ho to" />
      </div>
    </section>

    <p id="afterLine" class="after-line"></p>
    <button type="submit" id="saveBtn" class="btn-primary">Save</button>
    <p id="msg" class="msg" role="status"></p>

  </form>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
