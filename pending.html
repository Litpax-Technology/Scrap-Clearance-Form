<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Collection</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <div class="form-card">
    <div class="header">
      <h1>Pending Collection</h1>
      <p>Jinka balance baaki hai unka paisa yahan receive karo.</p>
    </div>

    <div class="pending-banner">
      <div>
        <span>Total Pending Amount</span>
        <strong id="totalPendingText">Loading...</strong>
      </div>
      <a href="index.html" class="collect-link">← Back to Form</a>
    </div>

    <div class="collect-box">
      <label class="cb-label">Clearance ID</label>
      <select id="clearanceSelect" class="cb-select">
        <option value="">Loading...</option>
      </select>

      <label class="cb-label">Amount Received</label>
      <input type="number" id="receiveInput" class="cb-input" min="0" step="0.01" placeholder="₹ amount" />

      <button id="receiveBtn" class="cb-btn">Receive Payment</button>

      <div id="resultLine" class="cb-result"></div>
    </div>
  </div>
</div>
<script src="pending.js"></script>
</body>
</html>
